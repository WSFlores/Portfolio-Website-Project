  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    /* Recursively draws a Sierpinski triangle given three vertices (a, b, c).
       Stops subdividing at depth 0, drawing a filled+stroked triangle. */
    function sierpinski(ax, ay, bx, by, cx, cy, d) {
      if (d === 0) {
        ctx.beginPath();
        ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy);
        ctx.closePath();
        ctx.fillStyle = 'rgba(55,125,205,0.11)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(100,175,255,0.18)';
        ctx.lineWidth = 0.55;
        ctx.stroke();
        return;
      }
      /* Split each edge at its midpoint and recurse into the three corner triangles */
      const mx1 = (ax+bx)/2, my1 = (ay+by)/2;
      const mx2 = (bx+cx)/2, my2 = (by+cy)/2;
      const mx3 = (ax+cx)/2, my3 = (ay+cy)/2;
      sierpinski(ax,ay,  mx1,my1, mx3,my3, d-1); /* top corner */
      sierpinski(mx1,my1, bx,by,  mx2,my2, d-1); /* bottom-left corner */
      sierpinski(mx3,my3, mx2,my2, cx,cy,  d-1); /* bottom-right corner */
    }

    /* Fills the canvas with a 3x3 tiled grid of Sierpinski triangles
       so the pattern repeats across the whole screen */
    function draw() {
      const w = canvas.width  = innerWidth;
      const h = canvas.height = innerHeight;

      /* Background fill */
      ctx.fillStyle = '#0b1829';
      ctx.fillRect(0, 0, w, h);

      /* Tile size: divide the screen into a 3-column, 3-row grid */
      const cols = 3, rows = 3;
      const tileW = w / cols;
      const tileH = h / rows;
      const size  = Math.max(tileW, tileH) * 1.6; /* each triangle slightly overflows its tile */
      const th    = size * Math.sqrt(3) / 2;       /* triangle height for equilateral at this size */

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          /* Centre point of this tile */
          const cx = tileW * (col + 0.5);
          const cy = tileH * (row + 0.5) + th * 0.05;

          /* Three vertices of the equilateral triangle centred on (cx, cy) */
          sierpinski(
            cx,          cy - th * 0.667,   /* top vertex */
            cx - size/2, cy + th * 0.333,   /* bottom-left vertex */
            cx + size/2, cy + th * 0.333,   /* bottom-right vertex */
            6                               /* recursion depth */
          );
        }
      }
    }

    /* Redraw whenever the window is resized */
    window.addEventListener('resize', draw);
    draw();
  </script>
