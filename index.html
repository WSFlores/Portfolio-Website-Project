<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Landing Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
    }

    header {
      background: #4a90e2;
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 40px;
    }

    header p {
      font-size: 18px;
      margin-top: 10px;
    }

    .container {
      padding: 40px 20px;
      text-align: center;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #4a90e2;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .btn:hover {
      background: #357ab8;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #222;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Welcome to My Site</h1>
    <p>A simple landing page built with HTML & CSS</p>
  </header>

  <div class="container">
    <h2>About This Page</h2>
    <p>This is a clean and minimal landing page template you can customize easily.</p>
    <a href="#" class="btn">Get Started</a>
  </div>

  <footer>
    <p>© 2026 My Website. All rights reserved.</p>
  </footer>

</body>
</html>
